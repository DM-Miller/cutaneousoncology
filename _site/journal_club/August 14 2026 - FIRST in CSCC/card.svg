  </text>

  <text x="520" y="505"
        fill="#52616D"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22">
    2026;14(7):e015029.
  </text>

  <text x="108" y="552"
        fill="#31424E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20">
    doi: 10.1136/jitc-2026-015029
  </text>

  <rect x="108" y="596" width="108" height="6" rx="3" fill="#28A9A2"/>
  <rect x="216" y="596" width="48" height="6" rx="3" fill="#E25A4E"/>

