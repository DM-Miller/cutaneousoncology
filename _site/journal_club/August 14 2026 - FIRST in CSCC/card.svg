<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="700" viewBox="0 0 1200 700">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F8F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="18"
                    flood-color="#082D4D" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="42" y="42" width="1116" height="616" rx="28"
        fill="url(#bg)" filter="url(#shadow)"/>

  <rect x="42" y="42" width="9" height="616" rx="4.5"
        fill="#28A9A2"/>

  <text x="108" y="118"
        fill="#28A9A2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="3.2">
    PRIMARY ARTICLE · JOURNAL FOR IMMUNOTHERAPY OF CANCER
  </text>

  <text x="108" y="205"
        fill="#082D4D"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700">
    Frontline immunotherapy with
  </text>

  <text x="108" y="258"
        fill="#082D4D"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700">
    response-guided subsequent treatment
  </text>

  <text x="108" y="311"
        fill="#082D4D"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700">
    (FIRST) in cutaneous squamous cell carcinoma:
  </text>

  <text x="108" y="364"
        fill="#082D4D"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700">
    a Bayesian causal analysis of dose intensity,
  </text>

  <text x="108" y="417"
        fill="#082D4D"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700">
    early benefit, and treatment de-escalation
  </text>

  <text x="108" y="505"
        fill="#082D4D"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23"
        font-weight="700">
