<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF8F7"/>
      <stop offset="58%" stop-color="#F8FBFB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#082D4D" flood-opacity="0.10"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.35" fill="#28A9A2" opacity="0.28"/>
    </pattern>
  </defs>

  <rect x="42" y="42" width="1116" height="616" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="42" y="42" width="9" height="616" rx="4.5" fill="#28A9A2"/>
  <rect x="825" y="42" width="333" height="245" rx="28" fill="url(#dots)" opacity="0.55"/>

  <text x="108" y="118" fill="#168A8F" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="700" letter-spacing="3.2">
    PRIMARY ARTICLE · NATURE MEDICINE
  </text>

  <text x="108" y="205" fill="#082D4D" font-family="Arial, Helvetica, sans-serif"
        font-size="52" font-weight="800">
    MATISSE
  </text>

  <text x="108" y="278" fill="#082D4D" font-family="Arial, Helvetica, sans-serif"
        font-size="39" font-weight="700">
    Neoadjuvant ipilimumab + nivolumab
  </text>

  <text x="108" y="332" fill="#082D4D" font-family="Arial, Helvetica, sans-serif"
        font-size="39" font-weight="700">
    in resectable cutaneous SCC
  </text>

  <text x="108" y="403" fill="#31424E" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700">
    Randomized, noncomparative phase 2 trial
  </text>

  <text x="108" y="486" fill="#082D4D" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="700">
    Breukers SE, Traets JJH, van Dijk SW, et al.
  </text>

  <text x="108" y="528" fill="#52616D" font-family="Georgia, Times New Roman, serif"
        font-size="22" font-style="italic">
    Nature Medicine.
  </text>

  <text x="278" y="528" fill="#52616D" font-family="Arial, Helvetica, sans-serif"
        font-size="22">
    2025;31(12):4055–4064.
  </text>

  <text x="108" y="575" fill="#31424E" font-family="Arial, Helvetica, sans-serif"
        font-size="19">
    doi: 10.1038/s41591-025-03943-w
  </text>

  <rect x="108" y="615" width="108" height="6" rx="3" fill="#28A9A2"/>
  <rect x="216" y="615" width="48" height="6" rx="3" fill="#E25A4E"/>
</svg>
