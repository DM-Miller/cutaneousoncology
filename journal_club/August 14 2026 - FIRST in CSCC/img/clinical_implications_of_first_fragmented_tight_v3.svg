<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #082D4D; }
      .title { font-size: 66px; font-weight: 800; }
      .subtitle { font-size: 28px; font-style: italic; fill: #666666; }
      .panel-title { font-size: 27px; font-weight: 800; }
      .panel-body { font-size: 16px; fill: #1F2A37; }
      .micro { font-size: 15px; font-style: italic; font-weight: 700; }
      .footer-big { font-size: 24px; font-weight: 800; }
      .footer-core { font-size: 24px; font-weight: 800; fill: #7BE0D8; }
      .badge-num { font-size: 25px; font-weight: 800; fill: white; text-anchor: middle; dominant-baseline: central; }
      .axis { stroke: #082D4D; stroke-width: 3; fill: none; }
      .teal-stroke { stroke: #15959D; }
      .navy-stroke { stroke: #082D4D; }
      .coral-stroke { stroke: #EF5A49; }
      .panel { fill: white; stroke-width: 2.2; }
      .divider { stroke-width: 1.8; opacity: 0.7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="920" fill="#FBFCFD"/>

  <!-- Title -->
  <text x="800" y="78" class="title" text-anchor="middle">Clinical implications of FIRST</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">Response-guided care, limited-duration therapy, and slow medicine in CSCC</text>

  <!-- Panel 1 -->
  <g id="panel1" class="fragment" data-fragment-index="1">
    <rect x="42" y="156" rx="22" ry="22" width="724" height="308" class="panel teal-stroke panel"/>
    <circle cx="174" cy="310" r="114" fill="#EEF7F7"/>

    <!-- icon 1: graph -->
    <line x1="110" y1="368" x2="110" y2="236" class="axis"/>
    <polygon points="110,236 104,248 116,248" fill="#082D4D"/>
    <line x1="110" y1="368" x2="265" y2="368" class="axis"/>
    <polygon points="265,368 253,362 253,374" fill="#082D4D"/>
    <text x="66" y="306" font-size="17" font-weight="700" transform="rotate(-90 66 306)">Response</text>
    <text x="185" y="422" font-size="17" font-weight="700">Doses</text>
    <text x="126" y="395" font-size="17">1</text>
    <text x="160" y="395" font-size="17">2</text>
    <text x="194" y="395" font-size="17">3</text>
    <text x="228" y="395" font-size="17">4</text>
    <text x="258" y="395" font-size="17">5+</text>
    <path d="M129 326 C 142 293, 159 272, 182 258 S 214 248, 221 247" fill="none" stroke="#15959D" stroke-width="5"/>
    <path d="M221 247 C 239 243, 254 243, 268 243" fill="none" stroke="#15959D" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10"/>
    <circle cx="129" cy="326" r="8" fill="#15959D"/>
    <circle cx="184" cy="277" r="8" fill="#15959D"/>

    <circle cx="324" cy="208" r="21" fill="#15959D"/>
    <text x="324" y="208" class="badge-num">1</text>
    <text x="366" y="218" class="panel-title" style="fill:#15959D;">Benefit is front-loaded</text>

    <text x="316" y="265" class="panel-body">
      <tspan x="316" dy="0">The largest response gains appear early—</tspan>
      <tspan x="316" dy="34">especially from dose 1 → 2. Additional</tspan>
      <tspan x="316" dy="34">doses may help, but later benefit looks</tspan>
      <tspan x="316" dy="34">smaller and more uncertain.</tspan>
    </text>

    <line x1="316" y1="394" x2="740" y2="394" class="divider teal-stroke"/>

    <g transform="translate(318,413)">
      <line x1="0" y1="24" x2="0" y2="12" stroke="#15959D" stroke-width="3"/>
      <line x1="13" y1="24" x2="13" y2="4" stroke="#15959D" stroke-width="3"/>
      <line x1="26" y1="24" x2="26" y2="16" stroke="#15959D" stroke-width="3"/>
      <polyline points="0,20 13,10 26,13 39,-1" fill="none" stroke="#15959D" stroke-width="3"/>
      <polyline points="31,-1 39,-1 39,7" fill="none" stroke="#15959D" stroke-width="3"/>
    </g>
    <text x="374" y="432" class="micro" style="fill:#15959D;">most benefit early</text>
  </g>

  <!-- Panel 2 -->
  <g id="panel2" class="fragment" data-fragment-index="2">
    <rect x="790" y="156" rx="22" ry="22" width="724" height="308" class="panel navy-stroke panel"/>
    <circle cx="952" cy="310" r="114" fill="#F2F5F9"/>

    <!-- clock -->
    <circle cx="915" cy="262" r="52" fill="none" stroke="#082D4D" stroke-width="4"/>
    <line x1="915" y1="210" x2="915" y2="201" stroke="#082D4D" stroke-width="4"/>
    <line x1="915" y1="314" x2="915" y2="323" stroke="#082D4D" stroke-width="4"/>
    <line x1="863" y1="262" x2="854" y2="262" stroke="#082D4D" stroke-width="4"/>
    <line x1="967" y1="262" x2="976" y2="262" stroke="#082D4D" stroke-width="4"/>
    <line x1="915" y1="262" x2="915" y2="229" stroke="#082D4D" stroke-width="4" stroke-linecap="round"/>
    <line x1="915" y1="262" x2="940" y2="280" stroke="#082D4D" stroke-width="4" stroke-linecap="round"/>

    <!-- hourglass -->
    <path d="M955 229 h44 M963 229 C963 245, 974 251, 978 257 C982 262, 982 262, 978 268 C974 274, 963 280, 963 296
             M999 229 C999 245, 988 251, 984 257 C980 262, 980 262, 984 268 C988 274, 999 280, 999 296
             M955 296 h44" fill="none" stroke="#082D4D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- flow -->
    <line x1="808" y1="351" x2="1058" y2="351" stroke="#9DB8C7" stroke-width="2.2" stroke-dasharray="5 6"/>
    <rect x="808" y="335" rx="8" ry="8" width="44" height="30" fill="#15959D"/>
    <text x="830" y="355" fill="white" font-size="17" font-weight="700" text-anchor="middle">IO</text>
    <rect x="870" y="335" rx="8" ry="8" width="70" height="30" fill="#EF5A49"/>
    <text x="905" y="355" fill="white" font-size="17" font-weight="700" text-anchor="middle">Surgery</text>
    <rect x="950" y="335" rx="8" ry="8" width="42" height="30" fill="#8F8F8F"/>
    <text x="971" y="355" fill="white" font-size="17" font-weight="700" text-anchor="middle">RT</text>
    <rect x="1000" y="335" rx="8" ry="8" width="78" height="30" fill="#082D4D"/>
    <text x="1039" y="355" fill="white" font-size="17" font-weight="700" text-anchor="middle">Systemic</text>

    <circle cx="1098" cy="208" r="21" fill="#082D4D"/>
    <text x="1098" y="208" class="badge-num">2</text>
    <text x="1140" y="218" class="panel-title">Practice slow medicine</text>

    <text x="1100" y="265" class="panel-body">
      <tspan x="1100" dy="0">Do not rush to escalation. Allow time</tspan>
      <tspan x="1100" dy="34">to observe immunotherapy response</tspan>
      <tspan x="1100" dy="34">before reflexively adding surgery,</tspan>
      <tspan x="1100" dy="34">radiation, or prolonged therapy.</tspan>
    </text>

    <line x1="1090" y1="394" x2="1478" y2="394" class="divider navy-stroke"/>

    <circle cx="1118" cy="424" r="18" fill="none" stroke="#082D4D" stroke-width="4"/>
    <line x1="1118" y1="424" x2="1118" y2="413" stroke="#082D4D" stroke-width="3"/>
    <line x1="1118" y1="424" x2="1127" y2="424" stroke="#082D4D" stroke-width="3"/>
    <text x="1156" y="436" class="micro">avoid reflexive escalation</text>
  </g>

  <!-- Panel 3 -->
  <g id="panel3" class="fragment" data-fragment-index="3">
    <rect x="42" y="494" rx="22" ry="22" width="724" height="308" class="panel teal-stroke panel"/>
    <circle cx="174" cy="648" r="114" fill="#EEF7F7"/>

    <!-- shield -->
    <path d="M95 547 C113 552, 130 541, 141 530 C152 541, 169 552, 187 547
             C187 593, 166 618, 141 634 C116 618, 95 593, 95 547 Z"
          fill="#15959D" opacity="0.95" stroke="#15959D" stroke-width="2"/>
    <path d="M121 575 L136 590 L161 563" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- decision tree -->
    <rect x="60" y="633" width="51" height="30" rx="8" ry="8" fill="#15959D"/>
    <text x="85" y="653" fill="white" font-size="17" font-weight="700" text-anchor="middle">IO</text>
    <line x1="111" y1="648" x2="144" y2="648" stroke="#15959D" stroke-width="4"/>
    <circle cx="150" cy="648" r="12" fill="white" stroke="#082D4D" stroke-width="3"/>

    <line x1="161" y1="637" x2="200" y2="583" stroke="#15959D" stroke-width="3" stroke-dasharray="7 6"/>
    <polygon points="204,579 194,582 200,589" fill="#15959D"/>
    <g>
      <circle cx="214" cy="568" r="7" fill="white" stroke="#15959D" stroke-width="3"/>
      <circle cx="214" cy="592" r="14" fill="white" stroke="#15959D" stroke-width="3"/>
      <line x1="206" y1="596" x2="222" y2="596" stroke="#15959D" stroke-width="3"/>
    </g>
    <text x="232" y="570" font-size="15" fill="#1F2A37">Continue</text>
    <text x="232" y="591" font-size="15" fill="#1F2A37">observation</text>

    <line x1="161" y1="660" x2="200" y2="690" stroke="#8F8F8F" stroke-width="3" stroke-dasharray="7 6"/>
    <polygon points="204,694 194,691 198,684" fill="#8F8F8F"/>
    <rect x="210" y="645" width="88" height="54" rx="10" ry="10" fill="#ECECEC"/>
    <text x="254" y="668" font-size="17" fill="#1F2A37" text-anchor="middle">Surgery /</text>
    <text x="254" y="689" font-size="17" fill="#1F2A37" text-anchor="middle">RT</text>

    <circle cx="324" cy="547" r="21" fill="#15959D"/>
    <text x="324" y="547" class="badge-num">3</text>
    <text x="356" y="557" class="panel-title" font-size="24" style="fill:#15959D;">De-escalate in deep responders</text>

    <text x="320" y="603" class="panel-body">
      <tspan x="320" dy="0">Response may matter more than an arbitrary</tspan>
      <tspan x="320" dy="32">treatment duration. Some deep responders</tspan>
      <tspan x="320" dy="32">may not need immediate consolidation;</tspan>
      <tspan x="320" dy="32">limited-duration therapy may capture most</tspan>
      <tspan x="320" dy="32">achievable benefit.</tspan>
    </text>

    <line x1="320" y1="739" x2="740" y2="739" class="divider teal-stroke"/>

    <g transform="translate(326,756)">
      <circle cx="15" cy="9" r="8" fill="none" stroke="#15959D" stroke-width="3"/>
      <path d="M4 31 C 7 22, 15 18, 24 18 C 33 18, 41 22, 44 31" fill="none" stroke="#15959D" stroke-width="3"/>
    </g>
    <text x="382" y="772" class="micro" style="fill:#15959D;">defer consolidation selectively</text>
  </g>

  <!-- Panel 4 -->
  <g id="panel4" class="fragment" data-fragment-index="4">
    <rect x="790" y="494" rx="22" ry="22" width="724" height="308" class="panel coral-stroke panel"/>
    <circle cx="952" cy="648" r="114" fill="#FFF3F1"/>

    <!-- target -->
    <circle cx="920" cy="624" r="60" fill="none" stroke="#082D4D" stroke-width="4"/>
    <circle cx="920" cy="624" r="36" fill="none" stroke="#082D4D" stroke-width="2"/>
    <line x1="860" y1="624" x2="980" y2="624" stroke="#082D4D" stroke-width="3"/>
    <line x1="920" y1="564" x2="920" y2="684" stroke="#082D4D" stroke-width="3"/>

    <circle cx="920" cy="601" r="8" fill="#EF5A49"/>
    <circle cx="897" cy="610" r="7" fill="#EF5A49"/>
    <circle cx="943" cy="610" r="7" fill="#EF5A49"/>
    <path d="M905 638 C905 625, 935 625, 935 638 Z" fill="#EF5A49"/>
    <path d="M884 638 C884 629, 906 629, 906 638 Z" fill="#EF5A49"/>
    <path d="M934 638 C934 629, 956 629, 956 638 Z" fill="#EF5A49"/>

    <line x1="962" y1="667" x2="1005" y2="710" stroke="#082D4D" stroke-width="9" stroke-linecap="round"/>

    <circle cx="1098" cy="547" r="21" fill="#EF5A49"/>
    <text x="1098" y="547" class="badge-num">4</text>
    <text x="1140" y="557" class="panel-title" style="fill:#EF5A49;">Intensify selectively</text>

    <text x="1090" y="603" class="panel-body">
      <tspan x="1090" dy="0">Escalation should focus on early</tspan>
      <tspan x="1090" dy="32">nonresponders, progressive disease,</tspan>
      <tspan x="1090" dy="32">or clearly high-risk patients—not</tspan>
      <tspan x="1090" dy="32">everyone by default.</tspan>
    </text>

    <line x1="1088" y1="739" x2="1478" y2="739" class="divider coral-stroke"/>

    <g transform="translate(1092,754)">
      <circle cx="8" cy="9" r="7" fill="none" stroke="#EF5A49" stroke-width="3"/>
      <circle cx="25" cy="9" r="7" fill="none" stroke="#EF5A49" stroke-width="3"/>
      <circle cx="42" cy="9" r="7" fill="none" stroke="#EF5A49" stroke-width="3"/>
      <path d="M0 27 C2 20, 8 17, 14 17 C20 17, 26 20, 28 27" fill="none" stroke="#EF5A49" stroke-width="3"/>
      <path d="M17 27 C19 20, 25 17, 31 17 C37 17, 43 20, 45 27" fill="none" stroke="#EF5A49" stroke-width="3"/>
      <path d="M34 27 C36 20, 42 17, 48 17 C54 17, 60 20, 62 27" fill="none" stroke="#EF5A49" stroke-width="3"/>
    </g>
    <text x="1160" y="772" class="micro" style="fill:#EF5A49;">focus trials on nonresponders</text>
  </g>

  <!-- Footer -->
  <g id="core-message" class="fragment" data-fragment-index="5">
    <rect x="42" y="830" width="1472" height="78" rx="18" ry="18" fill="#082D4D"/>

    <circle cx="140" cy="869" r="34" fill="white"/>
    <circle cx="140" cy="869" r="18" fill="none" stroke="#082D4D" stroke-width="3"/>
    <circle cx="140" cy="869" r="9" fill="none" stroke="#082D4D" stroke-width="3"/>
    <line x1="140" y1="851" x2="140" y2="860" stroke="#082D4D" stroke-width="3"/>
    <line x1="122" y1="869" x2="131" y2="869" stroke="#082D4D" stroke-width="3"/>
    <path d="M148 862 L164 848" fill="none" stroke="#28A9A2" stroke-width="4"/>
    <polygon points="167,845 154,848 162,855" fill="#28A9A2"/>

    <line x1="240" y1="846" x2="240" y2="892" stroke="white" stroke-width="3" opacity="0.9"/>

    <text x="302" y="871" class="footer-core">Core message:</text>
    <text x="560" y="871" class="footer-big" style="fill:white;">
      <tspan x="560" dy="0">individualized, response-guided care may be better</tspan>
      <tspan x="560" dy="29">than one-size-fits-all prolonged treatment.</tspan>
    </text>

    <circle cx="1418" cy="856" r="10" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="1390" cy="864" r="8" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="1446" cy="864" r="8" fill="none" stroke="white" stroke-width="3"/>
    <path d="M1404 893 C1408 879, 1418 875, 1430 875 C1441 875, 1451 879, 1455 893" fill="none" stroke="white" stroke-width="3"/>
    <path d="M1376 893 C1379 883, 1387 879, 1395 879 C1403 879, 1411 882, 1416 890" fill="none" stroke="white" stroke-width="3"/>
    <path d="M1442 890 C1447 882, 1454 879, 1462 879 C1470 879, 1478 883, 1481 893" fill="none" stroke="white" stroke-width="3"/>
    <path d="M1364 900 C1387 889, 1420 887, 1448 892 C1464 894, 1475 897, 1489 902" fill="none" stroke="#28A9A2" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
