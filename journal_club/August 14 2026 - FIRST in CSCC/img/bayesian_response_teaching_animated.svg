<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- =========================================================
       BAYESIAN MODEL → PREDICTED RESPONSE PROBABILITIES
       Animated teaching SVG for Quarto / Reveal.js — layout-refined final

       USE INLINE (important for fragments):
         {{< include img/bayesian_response_teaching.svg >}}

       Reveal sequence:
         1 Priors
         2 Observed data
         3 Bayesian model
         4 Posterior distribution
         5 Posterior draws
         6 Predicted response probabilities
         7 Take-home idea

       Each beat is a <g class="fragment"> group.
       ========================================================= -->

  <style>
    text { font-family: Arial, sans-serif; fill:#0b2142; }
    .title { font-size:43px; font-weight:700; }
    .subtitle { font-size:25px; font-style:italic; fill:#61738a; }
    .panel { fill:#fff; stroke:#c8d0db; stroke-width:2; }
    .panel-final { fill:#fff; stroke:#087b83; stroke-width:2.5; }
    .num-blue { fill:#082f68; }
    .num-teal { fill:#087b83; }
    .num { fill:#fff; font-size:22px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
    .h2 { font-size:20px; font-weight:700; text-anchor:middle; }
    .body { font-size:16px; fill:#111827; }
    .small { font-size:14px; fill:#4b5563; }
    .teal { fill:#087b83; }
    .blue { fill:#082f68; }
    .line-blue { stroke:#0a58ad; fill:none; }
    .line-teal { stroke:#008b8f; fill:none; }
    .axis { stroke:#374151; stroke-width:1.4; }
    .grid { stroke:#d6dde6; stroke-width:1; }
    .soft-blue { fill:#eef5fc; stroke:#87add6; }
    .soft-teal { fill:#edf9f8; stroke:#68b7b5; }
    .soft-gray { fill:#f8fafc; stroke:#c8d0db; }
    .arrow { fill:#16477f; }
    .fragment { opacity:1; }
  </style>

  <defs>
    <linearGradient id="takehome" x1="0" x2="1">
      <stop offset="0" stop-color="#eef5fc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- STATIC TITLE -->
  <text x="800" y="62" text-anchor="middle" class="title">From Bayesian Model to Response Predictions</text>
  <text x="800" y="103" text-anchor="middle" class="subtitle">A clinician-friendly view of how the analysis works</text>

  <!-- =========================================================
       FRAGMENT 1 — PRIORS
       ========================================================= -->
  <g id="priors" class="fragment" data-fragment-index="1">
    <rect x="14" y="142" width="230" height="535" rx="18" class="panel"/>
    <circle cx="129" cy="172" r="20" class="num-blue"/>
    <text x="129" y="172" class="num">1</text>
    <text x="129" y="226" class="h2">1. Priors</text>
    <line x1="40" y1="252" x2="218" y2="252" stroke="#087b83"/>
    <circle cx="129" cy="252" r="4" fill="#087b83"/>
    <text x="129" y="294" text-anchor="middle" class="body">Starting beliefs about</text>
    <text x="129" y="316" text-anchor="middle" class="body">plausible parameter values</text>

    <line x1="28" y1="548" x2="228" y2="548" class="axis"/>
    <path d="M30 548 C45 540 50 420 75 420 C100 420 105 548 120 548" class="line-teal" stroke-width="2.2"/>
    <path d="M68 548 C92 548 105 398 145 398 C182 398 184 548 205 548" class="line-blue" stroke-width="2.2"/>
    <path d="M155 548 C170 548 178 435 196 435 C214 435 216 548 228 548" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <text x="129" y="588" text-anchor="middle" class="body">Parameter value</text>
  </g>

  <!-- ARROW 1 -->
  <g class="fragment" data-fragment-index="2">
    <path d="M244 310 H268 V298 L292 318 L268 338 V326 H244 Z" class="arrow"/>
  </g>

  <!-- =========================================================
       FRAGMENT 2 — OBSERVED DATA
       ========================================================= -->
  <g id="observed-data" class="fragment" data-fragment-index="2">
    <rect x="262" y="142" width="230" height="535" rx="18" class="panel"/>
    <circle cx="377" cy="172" r="20" class="num-teal"/>
    <text x="377" y="172" class="num">2</text>
    <text x="377" y="226" class="h2 teal">2. Observed data</text>
    <line x1="286" y1="252" x2="468" y2="252" stroke="#087b83"/>
    <circle cx="377" cy="252" r="4" fill="#087b83"/>
    <text x="377" y="286" text-anchor="middle" class="body">Patient response,</text>
    <text x="377" y="308" text-anchor="middle" class="body">dose count, and</text>
    <text x="377" y="330" text-anchor="middle" class="body">baseline covariates</text>

    <rect x="272" y="365" width="210" height="160" fill="#fff" stroke="#7b8794"/>
    <rect x="272" y="365" width="210" height="30" fill="#087b83"/>
    <g font-size="9.5" font-weight="700" fill="#fff">
      <text x="298" y="384" text-anchor="middle" fill="#fff">Response</text>
      <text x="350" y="384" text-anchor="middle" fill="#fff">Dose</text>
      <text x="390" y="384" text-anchor="middle" fill="#fff">Age</text>
      <text x="426" y="384" text-anchor="middle" fill="#fff">Stage</text>
      <text x="463" y="384" text-anchor="middle" fill="#fff">ECOG</text>
    </g>
    <g font-size="12" fill="#111827">
      <text x="300" y="416">1</text><text x="349" y="416">5</text><text x="388" y="416">62</text><text x="426" y="416">III</text><text x="459" y="416">1</text>
      <text x="300" y="448">0</text><text x="349" y="448">3</text><text x="388" y="448">55</text><text x="426" y="448">IV</text><text x="459" y="448">0</text>
      <text x="300" y="480">1</text><text x="349" y="480">8</text><text x="388" y="480">70</text><text x="426" y="480">III</text><text x="459" y="480">1</text>
      <text x="300" y="512">…</text><text x="349" y="512">…</text><text x="388" y="512">…</text><text x="426" y="512">…</text><text x="459" y="512">…</text>
    </g>
    <g stroke="#c8d0db">
      <line x1="276" y1="393" x2="478" y2="393"/><line x1="276" y1="425" x2="478" y2="425"/>
      <line x1="276" y1="457" x2="478" y2="457"/><line x1="276" y1="489" x2="478" y2="489"/>
      <line x1="335" y1="365" x2="335" y2="525"/><line x1="375" y1="365" x2="375" y2="525"/>
      <line x1="410" y1="365" x2="410" y2="525"/><line x1="447" y1="365" x2="447" y2="525"/>
    </g>
    <circle cx="321" cy="584" r="18" fill="#087b83"/>
    <path d="M294 632 Q321 596 348 632 V650 H294Z" fill="#087b83"/>
    <line x1="365" y1="576" x2="458" y2="576" stroke="#c8d0db" stroke-width="2"/>
    <line x1="365" y1="597" x2="446" y2="597" stroke="#c8d0db" stroke-width="2"/>
    <line x1="365" y1="618" x2="434" y2="618" stroke="#c8d0db" stroke-width="2"/>
  </g>

  <!-- ARROW 2 -->
  <g class="fragment" data-fragment-index="3">
    <path d="M492 310 H516 V298 L540 318 L516 338 V326 H492 Z" class="arrow"/>
  </g>

  <!-- =========================================================
       FRAGMENT 3 — BAYESIAN MODEL
       ========================================================= -->
  <g id="bayesian-model" class="fragment" data-fragment-index="3">
    <rect x="510" y="142" width="238" height="535" rx="18" class="panel"/>
    <circle cx="629" cy="172" r="20" class="num-blue"/>
    <text x="629" y="172" class="num">3</text>
    <text x="629" y="216" class="h2"><tspan x="629">3. Bayesian</tspan><tspan x="629" dy="23">model</tspan></text>
    <line x1="540" y1="262" x2="718" y2="262" stroke="#082f68"/>
    <circle cx="629" cy="262" r="4" fill="#082f68"/>
    <text x="629" y="292" text-anchor="middle" class="body">Model response while</text>
    <text x="629" y="314" text-anchor="middle" class="body">adjusting for confounders</text>

    <rect x="522" y="365" width="214" height="98" rx="10" class="soft-blue"/>
    <text x="629" y="401" text-anchor="middle" font-size="18" font-family="Georgia, serif" font-style="italic">Yᵢ ~ Bernoulli(pᵢ)</text>
    <text x="629" y="433" text-anchor="middle" font-size="17" font-family="Georgia, serif">logit(pᵢ) = α + f(Doseᵢ) + γXᵢ</text>

    <text x="629" y="501" text-anchor="middle" class="body" font-weight="700">Dose–response</text>
    <text x="629" y="523" text-anchor="middle" class="body" font-weight="700">assumptions</text>
    <rect x="532" y="528" width="58" height="38" rx="5" class="soft-gray"/>
    <path d="M538 558 L580 534" class="line-blue" stroke-width="2"/>
    <text x="605" y="553" class="body">Linear</text>
    <rect x="532" y="574" width="58" height="38" rx="5" class="soft-gray"/>
    <path d="M538 604 Q548 579 582 580" class="line-blue" stroke-width="2"/>
    <text x="605" y="599" class="body">Log-dose</text>
    <rect x="532" y="620" width="58" height="38" rx="5" class="soft-gray"/>
    <path d="M539 649 H553 V634 H581" class="line-blue" stroke-width="2"/>
    <text x="605" y="645" class="body">Threshold</text>
  </g>

  <!-- ARROW 3 -->
  <g class="fragment" data-fragment-index="4">
    <path d="M748 310 H772 V298 L796 318 L772 338 V326 H748 Z" class="arrow"/>
  </g>

  <!-- =========================================================
       FRAGMENT 4 — POSTERIOR DISTRIBUTION
       ========================================================= -->
  <g id="posterior-distribution" class="fragment" data-fragment-index="4">
    <rect x="766" y="142" width="248" height="535" rx="18" class="panel"/>
    <circle cx="890" cy="172" r="20" class="num-teal"/>
    <text x="890" y="172" class="num">4</text>
    <text x="890" y="216" class="h2 teal"><tspan x="890">4. Posterior</tspan><tspan x="890" dy="23">distribution</tspan></text>
    <line x1="796" y1="262" x2="984" y2="262" stroke="#087b83"/>
    <circle cx="890" cy="262" r="4" fill="#087b83"/>
    <text x="890" y="292" text-anchor="middle" class="body">Priors + data update</text>
    <text x="890" y="314" text-anchor="middle" class="body">to a posterior</text>

    <line x1="786" y1="550" x2="994" y2="550" class="axis"/>
    <path d="M790 550 C812 550 818 405 842 405 C866 405 870 550 890 550" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M835 550 C860 550 870 402 904 402 C940 402 946 550 985 550" class="line-teal" stroke-width="2.4"/>
    <line x1="908" y1="368" x2="932" y2="368" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="938" y="373" class="small">Prior</text>
    <line x1="908" y1="394" x2="932" y2="394" stroke="#087b83" stroke-width="2"/>
    <text x="938" y="399" class="small">Posterior</text>

    <rect x="780" y="592" width="220" height="50" rx="8" class="soft-teal"/>
    <text x="890" y="624" text-anchor="middle" font-size="17" font-family="Georgia, serif">Posterior ∝ Prior × Likelihood</text>
  </g>

  <!-- ARROW 4 -->
  <g class="fragment" data-fragment-index="5">
    <path d="M1014 310 H1038 V298 L1062 318 L1038 338 V326 H1014 Z" class="arrow"/>
  </g>

  <!-- =========================================================
       FRAGMENT 5 — POSTERIOR DRAWS
       ========================================================= -->
  <g id="posterior-draws" class="fragment" data-fragment-index="5">
    <rect x="1032" y="142" width="220" height="535" rx="18" class="panel"/>
    <circle cx="1142" cy="172" r="20" class="num-blue"/>
    <text x="1142" y="172" class="num">5</text>
    <text x="1142" y="216" class="h2"><tspan x="1142">5. Posterior</tspan><tspan x="1142" dy="23">draws</tspan></text>
    <line x1="1054" y1="262" x2="1230" y2="262" stroke="#082f68"/>
    <circle cx="1142" cy="262" r="4" fill="#082f68"/>
    <text x="1142" y="292" text-anchor="middle" class="body">Sample many plausible</text>
    <text x="1142" y="314" text-anchor="middle" class="body">parameter sets</text>

    <path d="M1080 414 C1100 414 1108 354 1132 354 C1158 354 1165 414 1205 414" class="line-teal" stroke-width="2"/>
    <g stroke="#c8d0db" stroke-dasharray="5 4">
      <line x1="1098" y1="414" x2="1098" y2="468"/><line x1="1118" y1="414" x2="1118" y2="468"/>
      <line x1="1138" y1="414" x2="1138" y2="468"/><line x1="1158" y1="414" x2="1158" y2="468"/>
      <line x1="1178" y1="414" x2="1178" y2="468"/>
    </g>
    <g fill="#087b83">
      <circle cx="1082" cy="470" r="4"/><circle cx="1102" cy="456" r="4"/><circle cx="1115" cy="475" r="4"/>
      <circle cx="1128" cy="462" r="4"/><circle cx="1141" cy="471" r="4"/><circle cx="1155" cy="459" r="4"/>
      <circle cx="1168" cy="476" r="4"/><circle cx="1183" cy="463" r="4"/><circle cx="1200" cy="472" r="4"/>
    </g>
    <path d="M1142 490 V520 H1129 L1142 538 L1155 520 H1148 V490Z" fill="#16477f"/>
    <rect x="1095" y="538" width="94" height="82" rx="10" class="soft-gray"/>
    <rect x="1112" y="550" width="60" height="46" rx="4" fill="#fff" stroke="#082f68" stroke-width="2"/>
    <path d="M1120 586 L1128 574 L1137 580 L1146 563 L1156 584 L1165 578" class="line-blue" stroke-width="2"/>
    <line x1="1142" y1="596" x2="1142" y2="608" stroke="#082f68" stroke-width="2"/>
    <line x1="1125" y1="608" x2="1159" y2="608" stroke="#082f68" stroke-width="2"/>
    <text x="1142" y="650" text-anchor="middle" class="body">Simulate outcomes across</text>
    <text x="1142" y="670" text-anchor="middle" class="body">doses and patients</text>
  </g>

  <!-- ARROW 5 -->
  <g class="fragment" data-fragment-index="6">
    <path d="M1252 310 H1276 V298 L1300 318 L1276 338 V326 H1252 Z" class="arrow"/>
  </g>

  <!-- =========================================================
       FRAGMENT 6 — PREDICTED RESPONSE PROBABILITIES
       ========================================================= -->
  <g id="predicted-response" class="fragment" data-fragment-index="6">
    <rect x="1270" y="142" width="316" height="535" rx="20" class="panel-final"/>
    <circle cx="1428" cy="172" r="20" class="num-teal"/>
    <text x="1428" y="172" class="num">6</text>
    <text x="1428" y="218" class="h2 teal">6. Predicted response</text>
    <text x="1428" y="244" class="h2 teal">probabilities</text>
    <line x1="1292" y1="268" x2="1564" y2="268" stroke="#087b83"/>
    <circle cx="1428" cy="268" r="4" fill="#087b83"/>
    <text x="1428" y="304" text-anchor="middle" class="body">Convert posterior draws into</text>
    <text x="1428" y="326" text-anchor="middle" class="body">clinically interpretable predictions</text>

    <!-- Plot -->
    <line x1="1326" y1="580" x2="1558" y2="580" class="axis"/>
    <line x1="1326" y1="580" x2="1326" y2="366" class="axis"/>
    <path d="M1326 548 C1370 515 1408 466 1450 430 C1492 394 1525 376 1558 365 L1558 445 C1520 451 1488 464 1450 486 C1408 510 1370 535 1326 560Z" fill="#d7e8fa"/>
    <path d="M1326 550 C1370 532 1408 497 1450 468 C1492 439 1525 425 1558 418 L1558 484 C1522 488 1490 495 1450 508 C1408 522 1370 542 1326 558Z" fill="#b7d5f3"/>
    <path d="M1326 552 C1370 531 1408 500 1450 474 C1492 448 1525 435 1558 428" class="line-blue" stroke-width="3"/>
    <line x1="1326" y1="544" x2="1558" y2="544" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="1548" y="532" text-anchor="end" font-size="13" fill="#dc2626">No dose effect</text>

    <text x="1442" y="616" text-anchor="middle" class="body">Dose (number of doses)</text>
    <text transform="translate(1292 478) rotate(-90)" text-anchor="middle" class="body">Predicted response probability</text>
    <g class="small">
      <text x="1310" y="584">0.0</text><text x="1310" y="542">0.2</text><text x="1310" y="500">0.4</text>
      <text x="1310" y="458">0.6</text><text x="1310" y="416">0.8</text><text x="1310" y="374">1.0</text>
    </g>

    <!-- Reference patient callout -->
    <rect x="1328" y="690" width="244" height="68" rx="14" fill="#f7fbfb" stroke="#087b83" stroke-width="1.6"/>
    <circle cx="1370" cy="713" r="12" fill="#087b83"/>
    <path d="M1350 744 Q1370 719 1390 744 V750 H1350Z" fill="#087b83"/>
    <text x="1404" y="718" class="body teal">For a standardized</text>
    <text x="1404" y="742" class="body teal">reference patient</text>
    <path d="M1432 690 V660 H1422 L1432 642 L1442 660 H1438 V690Z" fill="#087b83"/>
  </g>

  <!-- =========================================================
       FRAGMENT 7 — TAKE-HOME
       ========================================================= -->
  <g id="take-home" class="fragment" data-fragment-index="7">
    <rect x="220" y="790" width="1120" height="88" rx="18" fill="url(#takehome)" stroke="#082f68" stroke-width="2"/>
    <circle cx="292" cy="834" r="32" fill="#082f68"/>
    <circle cx="292" cy="827" r="12" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M282 839 H302 M286 846 H298" stroke="#fff" stroke-width="2"/>
    <path d="M292 805 V797 M270 813 L264 807 M314 813 L320 807 M264 830 H256 M320 830 H328" stroke="#fff" stroke-width="2"/>
    <text x="350" y="824" font-size="21" font-weight="700">Take-home idea:</text>
    <text x="525" y="824" font-size="19" fill="#111827">Bayesian modeling gives a distribution of plausible effects, then translates</text>
    <text x="350" y="852" font-size="19" fill="#111827">those effects into predicted response probabilities clinicians can interpret.</text>
  </g>

  <!-- =========================================================
       QUICK EDITING GUIDE

       Reveal order:
         Change data-fragment-index values.

       Want panel + incoming arrow on the SAME click?
         Give them the same data-fragment-index (done here).

       Change wording:
         Edit text inside <text> ... </text>.

       Move an object:
         Change x/y or path coordinates.

       IMPORTANT:
       If used as <img src="...">, Reveal cannot see internal fragments.
       Inline/fetch-inject the SVG so the <g class="fragment"> elements
       become part of the Reveal DOM.
       ========================================================= -->
</svg>
